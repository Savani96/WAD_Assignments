<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container my-4">
        <h1 class="text-center">Product Catalog</h1>
        <div class="table-responsive">
            <table class="table table-bordered table-striped mt-3" id="productTable">
                <thead class="table-primary">
                    <tr>
                        <th>Product Image</th>
                        <th>Product Name</th>
                        <th>Price (INR ₹)</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id="productBody"></tbody>
            </table>
        </div>

        <div class="pagination text-center" id="pagination"></div>
    </div>

    <script>
        const products = [
            { img: 'headphones.jpg', name: 'Wireless Headphones', price: 7999, desc: 'Noise-cancelling over-ear headphones.' },
            { img: 'smartwatch.jpg', name: 'Smartwatch', price: 12999, desc: 'Fitness tracking smartwatch.' },
            { img: 'mouse.jpg', name: 'Gaming Mouse', price: 2499, desc: 'Ergonomic gaming mouse.' },
            { img: 'laptop_stand.jpg', name: 'Laptop Stand', price: 1999, desc: 'Adjustable aluminum stand.' },
            { img: 'headphones.jpg', name: 'Wireless Headphones', price: 7999, desc: 'Noise-cancelling over-ear headphones.' },
            { img: 'smartwatch.jpg', name: 'Smartwatch', price: 12999, desc: 'Fitness tracking smartwatch.' },
            { img: 'mouse.jpg', name: 'Gaming Mouse', price: 2499, desc: 'Ergonomic gaming mouse.' },
            { img: 'laptop_stand.jpg', name: 'Laptop Stand', price: 1999, desc: 'Adjustable aluminum stand.' },
            { img: 'headphones.jpg', name: 'Wireless Headphones', price: 7999, desc: 'Noise-cancelling over-ear headphones.' },
            { img: 'smartwatch.jpg', name: 'Smartwatch', price: 12999, desc: 'Fitness tracking smartwatch.' },
            { img: 'mouse.jpg', name: 'Gaming Mouse', price: 2499, desc: 'Ergonomic gaming mouse.' },
            { img: 'laptop_stand.jpg', name: 'Laptop Stand', price: 1999, desc: 'Adjustable aluminum stand.' },
            { img: 'headphones.jpg', name: 'Wireless Headphones', price: 7999, desc: 'Noise-cancelling over-ear headphones.' },
            { img: 'smartwatch.jpg', name: 'Smartwatch', price: 12999, desc: 'Fitness tracking smartwatch.' },
            { img: 'mouse.jpg', name: 'Gaming Mouse', price: 2499, desc: 'Ergonomic gaming mouse.' },
            { img: 'laptop_stand.jpg', name: 'Laptop Stand', price: 1999, desc: 'Adjustable aluminum stand.' },
        ];

        const itemsPerPage = 10;
        let currentPage = 1;

        function displayProducts(page) {
            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const productBody = document.getElementById('productBody');
            productBody.innerHTML = '';

            products.slice(startIndex, endIndex).forEach(product => {
                const row = `<tr>
                    <td><img src="${product.img}" class="img-fluid" alt="${product.name}"></td>
                    <td>${product.name}</td>
                    <td>₹${product.price}</td>
                    <td>${product.desc}</td>
                </tr>`;
                productBody.innerHTML += row;
            });
        }

        function setupPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            const totalPages = Math.ceil(products.length / itemsPerPage);

            for (let i = 1; i <= totalPages; i++) {
                const button = document.createElement('button');
                button.className = "btn btn-primary mx-1";
                button.innerText = i;
                button.onclick = () => {
                    currentPage = i;
                    displayProducts(currentPage);
                };
                if (i === currentPage) button.disabled = true;
                pagination.appendChild(button);
            }
        }

        displayProducts(currentPage);
        setupPagination();
    </script>
</body>
</html>
