<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Product Listing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container my-4">
        <h1 class="text-center mb-4">Product Listing</h1>
        
        <div class="dropdown mb-3">
            <button class="btn btn-primary dropdown-toggle" type="button" id="categoryDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                Select Category
            </button>
            <ul class="dropdown-menu" aria-labelledby="categoryDropdown">
                <li><a class="dropdown-item" href="#" onclick="filterProducts('all')">All</a></li>
                <li><a class="dropdown-item" href="#" onclick="filterProducts('electronics')">Electronics</a></li>
                <li><a class="dropdown-item" href="#" onclick="filterProducts('fashion')">Fashion</a></li>
                <li><a class="dropdown-item" href="#" onclick="filterProducts('home-appliances')">Home Appliances</a></li>
            </ul>
        </div>

        <div id="product-list" class="row g-4"></div>
    </div>

    <script>
        const products = [
            { name: "Smartphone", category: "electronics", price: "₹15,000", image: "https://via.placeholder.com/150" },
            { name: "Laptop", category: "electronics", price: "₹50,000", image: "https://via.placeholder.com/150" },
            { name: "T-shirt", category: "fashion", price: "₹500", image: "https://via.placeholder.com/150" },
            { name: "Jeans", category: "fashion", price: "₹1000", image: "https://via.placeholder.com/150" },
            { name: "Microwave", category: "home-appliances", price: "₹7000", image: "https://via.placeholder.com/150" },
            { name: "Washing Machine", category: "home-appliances", price: "₹15000", image: "https://via.placeholder.com/150" }
        ];

        function displayProducts(filteredProducts) {
            const productList = document.getElementById('product-list');
            productList.innerHTML = ""; 
            filteredProducts.forEach(product => {
                productList.innerHTML += `
                    <div class="col-md-4">
                        <div class="card h-100">
                            <img src="${product.image}" class="card-img-top" alt="${product.name}">
                            <div class="card-body">
                                <h5 class="card-title">${product.name}</h5>
                                <p class="card-text">Price: ${product.price}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterProducts(category) {
            const filteredProducts = category === 'all' ? products : products.filter(p => p.category === category);
            displayProducts(filteredProducts);
        }

        window.onload = () => displayProducts(products);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
