<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration Form</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <h2>Event Registration Form</h2>
    <form id="registrationForm" novalidate>
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="fullName" placeholder="Full Name" required>
            <label for="fullName">Full Name</label>
        </div>

        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" placeholder="Email" required>
            <label for="email">Email</label>
        </div>

        <div class="form-floating mb-3">
            <input type="tel" class="form-control" id="phone" placeholder="Phone Number" required>
            <label for="phone">Phone Number</label>
        </div>

        <div class="mb-3">
            <label for="eventSelect" class="form-label">Select Event</label>
            <select class="form-select" id="eventSelect" required>
                <option value="" selected disabled>Choose...</option>
                <option value="Workshop">Workshop</option>
                <option value="Seminar">Seminar</option>
                <option value="Tech Talk">Tech Talk</option>
            </select>
        </div>

        <div class="form-floating mb-3">
            <textarea class="form-control" id="comments" placeholder="Comments"></textarea>
            <label for="comments">Comments (Optional)</label>
        </div>

        <button type="button" id="registerBtn" class="btn btn-primary">Register</button>
    </form>
</div>

<script>
    $(document).ready(function () {
        $("#registerBtn").click(function () {
            const fullName = $("#fullName").val();
            const email = $("#email").val();
            const phone = $("#phone").val();
            const selectedEvent = $("#eventSelect").val();
            const comments = $("#comments").val();

            if (!fullName || !email || !phone || !selectedEvent) {
                alert("Please fill in all required fields.");
                return;
            }

            const formData = {
                fullName: fullName,
                email: email,
                phone: phone,
                event: selectedEvent,
                comments: comments
            };

            // Save data to localStorage
            localStorage.setItem("eventRegistrationData", JSON.stringify(formData));

            // Simulate AJAX request (dummy URL)
            $.ajax({
                url: "https://jsonplaceholder.typicode.com/posts",
                type: "POST",
                data: JSON.stringify(formData),
                contentType: "application/json",
                success: function (response) {
                    alert("Registration successful! Data saved locally.");
                    $("#registrationForm")[0].reset();
                },
                error: function () {
                    alert("Registration successful! (Saved locally due to network issue)." );
                    $("#registrationForm")[0].reset();
                }
            });
        });
    });
</script>

</body>
</html>
